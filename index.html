<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A página tem faturamento real do cliente: fora de buscadores. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dashboard Cameron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   IDENTIDADE
   Cores do logo da Livraria Cameron. Os neutros não são cinza puro:
   puxam para o marinho da marca, para a tela parecer da rede e não
   um painel genérico.
   Tipografia: Fraunces nos títulos e nos números grandes — é a mesma
   face do wordmark "cameron" no logo. IBM Plex Sans na interface e
   nas tabelas, pelos algarismos tabulares.
   ============================================================ */
:root{
  --brand-red:#c2211f; --brand-red-2:#e0342c;
  --brand-blue:#14528c; --brand-blue-2:#2c78bd;
  --ink:#0c2440;

  --bg:#eef2f8; --surface:#ffffff; --surface-2:#e7edf6;
  --line:#dce4f0; --line-strong:#c1cee1;
  --text:#0f1e35; --text-dim:#55637c; --text-faint:#64708a;
  --pos:#0d7f4e; --neg:#c2211f; --warn:#a86a0c;
  --tag-loja:#0f4272; --tag-feira:#9c1a18; --tag-conf:#7a4d09;
  --shadow:0 1px 1px rgba(12,36,64,.04), 0 6px 20px rgba(12,36,64,.07);
  --shadow-alta:0 2px 4px rgba(12,36,64,.06), 0 14px 40px rgba(12,36,64,.11);
  --fds:rgba(20,82,140,.05);
  --topo:#0c2440; --topo-txt:#ffffff; --topo-dim:#9db3d3; --topo-linha:rgba(255,255,255,.14);

  --radius:16px; --radius-p:10px;
  --fonte-titulo:"Fraunces",Georgia,"Times New Roman",serif;
  --fonte-ui:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* O tema escuro é um conjunto de tokens só, reaproveitado nas três situações:
   preferência do sistema, botão do visualizador e botão da própria página.
   surface-2 precisa ser opaco: é o fundo do cabeçalho fixo das tabelas. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111f; --surface:#0e1c30; --surface-2:#162943;
    --line:#1d3253; --line-strong:#2a456d;
    --text:#e6edf9; --text-dim:#9aabc6; --text-faint:#6a7c99;
    --pos:#3ecf8e; --neg:#ff6b64; --warn:#e0a33b;
    --shadow:0 1px 1px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.34);
    --shadow-alta:0 2px 4px rgba(0,0,0,.45), 0 14px 40px rgba(0,0,0,.45);
    --fds:rgba(44,120,189,.1);
    --topo:#0a1728; --topo-linha:rgba(255,255,255,.09);
  }
}
:root[data-theme="dark"]{
  --bg:#08111f; --surface:#0e1c30; --surface-2:#162943;
  --line:#1d3253; --line-strong:#2a456d;
  --text:#e6edf9; --text-dim:#9aabc6; --text-faint:#8494b0;
  --pos:#3ecf8e; --neg:#ff6b64; --warn:#e0a33b;
  --tag-loja:#8fc0f0; --tag-feira:#ff9a95; --tag-conf:#ecc37e;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.34);
  --shadow-alta:0 2px 4px rgba(0,0,0,.45), 0 14px 40px rgba(0,0,0,.45);
  --fds:rgba(44,120,189,.1);
  --topo:#0a1728; --topo-linha:rgba(255,255,255,.09);
}
:root[data-theme="light"]{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#e7edf6;
  --line:#dce4f0; --line-strong:#c1cee1;
  --text:#0f1e35; --text-dim:#55637c; --text-faint:#64708a;
  --pos:#0d7f4e; --neg:#c2211f; --warn:#a86a0c;
  --tag-loja:#0f4272; --tag-feira:#9c1a18; --tag-conf:#7a4d09;
  --shadow:0 1px 1px rgba(12,36,64,.04), 0 6px 20px rgba(12,36,64,.07);
  --shadow-alta:0 2px 4px rgba(12,36,64,.06), 0 14px 40px rgba(12,36,64,.11);
  --fds:rgba(20,82,140,.05);
  --topo:#0c2440; --topo-linha:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.55 var(--fonte-ui);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-blue-2); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
}

/* ============================================================ TOPO
   Faixa fina em vez de bloco pesado: o vermelho da marca fica reservado
   para o que precisa de atenção (aba ativa, alertas, total do dia).      */
.topo{position:sticky; top:0; z-index:40; background:var(--topo); color:var(--topo-txt);
  border-bottom:1px solid var(--topo-linha)}
.topo__linha{max-width:1400px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
.marca{display:flex; align-items:center; gap:11px; min-width:0}
.marca svg{flex:none}
.marca__nome{font-family:var(--fonte-titulo); font-optical-sizing:auto; font-weight:600;
  font-size:17px; letter-spacing:-.1px; line-height:1.15}
.marca__sub{font-size:11px; color:var(--topo-dim); line-height:1.25; letter-spacing:.2px}
.pill{font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.9px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); color:#fff;
  padding:3px 9px; border-radius:999px; white-space:nowrap}
.topo__dir{margin-left:auto; display:flex; align-items:center; gap:10px}
.hoje{font-size:12px; color:var(--topo-dim); white-space:nowrap; font-variant-numeric:tabular-nums}
.btn-tema{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); color:#fff;
  width:34px; height:34px; border-radius:var(--radius-p); cursor:pointer; display:grid; place-items:center;
  transition:background .15s ease, border-color .15s ease}
.btn-tema:hover{background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.3)}

/* ============================================================ ABAS */
.abas{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:57px; z-index:35}
.abas__int{max-width:1400px; margin:0 auto; display:flex; gap:2px; overflow-x:auto; padding:0 14px}
.abas__int::-webkit-scrollbar{height:0}
.aba{background:none; border:0; cursor:pointer; position:relative;
  padding:13px 14px; font-size:14px; font-weight:500; color:var(--text-dim); white-space:nowrap;
  transition:color .15s ease}
.aba::after{content:""; position:absolute; left:14px; right:14px; bottom:0; height:2px;
  border-radius:2px 2px 0 0; background:transparent; transition:background .15s ease}
.aba:hover{color:var(--text)}
/* O estado ativo pinta por classe, não pelo atributo: o aria-selected continua lá
   para o leitor de tela, mas quem manda no visual é a classe.
   O vermelho da marca fica no filete; o rótulo usa a cor de texto, porque
   vermelho sobre branco não alcança o contraste mínimo de leitura. */
.abas .aba.ativa{color:var(--text); font-weight:600}
.abas .aba.ativa::after{background:var(--brand-red)}

/* ============================================================ LAYOUT */
.pagina{max-width:1400px; margin:0 auto; padding:24px 20px 72px}
.secao{display:none}
.secao.ativa{display:block}
h2.titulo{font-family:var(--fonte-titulo); font-optical-sizing:auto; font-weight:600;
  font-size:27px; margin:0 0 5px; letter-spacing:-.4px; line-height:1.15; text-wrap:balance}
.sub{color:var(--text-dim); font-size:13.5px; margin:0 0 22px; max-width:74ch}
.bloco{margin-bottom:30px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card__cab{padding:16px 18px 0}
.card__tit{font-size:14.5px; font-weight:600; margin:0; letter-spacing:-.1px}
.card__sub{font-size:12.5px; color:var(--text-dim); margin:3px 0 0; max-width:78ch}
.card__corpo{padding:16px 18px}

.kpis{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px 17px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kpi__rot{font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint)}
.kpi__val{font-family:var(--fonte-titulo); font-optical-sizing:auto; font-weight:600;
  font-size:31px; letter-spacing:-.8px; line-height:1.1; margin:9px 0 4px; font-variant-numeric:tabular-nums}
.kpi__pe{font-size:12.5px; color:var(--text-dim); line-height:1.45}
/* o cartão principal ganha um filete da marca no topo, em vez de borda inteira */
.kpi--destaque::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--brand-red)}
.kpi--destaque{box-shadow:var(--shadow-alta)}
.up{color:var(--pos); font-weight:700}
.down{color:var(--neg); font-weight:700}
.neutro{color:var(--text-dim)}

.aviso{display:flex; gap:13px; align-items:flex-start; border-radius:var(--radius); padding:14px 17px;
  margin-bottom:16px; font-size:13.5px; line-height:1.5; border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--shadow); border-left-width:3px}
.aviso--alerta{border-left-color:var(--warn)}
.aviso--info{border-left-color:var(--brand-blue-2)}
.aviso--ok{border-left-color:var(--pos)}
.aviso strong{display:block; margin-bottom:3px; font-weight:600}
.aviso__ico{font-size:17px; line-height:1.3}

.controles{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:16px}
.campo{display:flex; flex-direction:column; gap:5px}
.campo>span{font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint)}
select,input[type="date"],input[type="number"]{background:var(--surface); border:1px solid var(--line-strong);
  border-radius:var(--radius-p); padding:8px 11px; min-height:40px; transition:border-color .15s ease}
select:hover,input:hover{border-color:var(--brand-blue-2)}
.btn{background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-p);
  padding:8px 14px; min-height:40px; cursor:pointer; font-weight:500;
  transition:border-color .15s ease, background .15s ease}
.btn:hover{border-color:var(--brand-blue-2)}
.btn--primario{background:var(--brand-red); border-color:var(--brand-red); color:#fff; font-weight:600}
.btn--primario:hover{background:var(--brand-red-2); border-color:var(--brand-red-2)}
.btn--pequeno{padding:6px 11px; min-height:0; font-size:12.5px}

/* Chips: escolhem o que cada gráfico mostra. aria-pressed carrega o estado. */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:999px;
  padding:6px 13px; font-size:12.5px; font-weight:600; line-height:1.3;
  color:var(--text-dim); cursor:pointer; -webkit-appearance:none; appearance:none;
}
.chip:hover{border-color:var(--brand-blue-2); color:var(--text)}
.chip[aria-pressed="true"]{background:var(--brand-blue); border-color:var(--brand-blue); color:#fff}
.chip:focus-visible{outline:2px solid var(--brand-blue-2); outline-offset:2px}

.rolagem{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line);
  border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow)}
table{border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums}
th,td{padding:9px 12px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky; top:0; z-index:2; background:var(--surface-2); font-size:10.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:.9px; color:var(--text-dim); border-bottom:1px solid var(--line-strong)}
.fix{position:sticky; left:0; z-index:1; background:var(--surface)}
thead .fix{z-index:3; background:var(--surface-2)}
tbody tr:hover td,tbody tr:hover .fix{background:var(--surface-2)}
.lin-total td{font-weight:700; border-top:1px solid var(--line-strong); background:var(--surface-2)}
.lin-total .fix{background:var(--surface-2)}
.lin-sub td,.lin-sub .fix{font-weight:600; background:var(--surface-2)}
.fds td,.fds .fix{background:var(--fds)}
.vazio{color:var(--text-faint)}
.especial{color:var(--brand-red); font-weight:600}
.tag{font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; padding:2.5px 7px;
  border-radius:999px; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--line)}
/* o fundo da etiqueta é o próprio texto diluído, então os dois temas acompanham sozinhos */
.tag--loja{color:var(--tag-loja); background:color-mix(in srgb, var(--tag-loja) 14%, transparent); border-color:transparent}
.tag--feira{color:var(--tag-feira); background:color-mix(in srgb, var(--tag-feira) 14%, transparent); border-color:transparent}
.tag--conf{color:var(--tag-conf); background:color-mix(in srgb, var(--tag-conf) 16%, transparent); border-color:transparent}

.barra{height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; display:flex}
.barra i{display:block; height:100%}
.svg-caixa{width:100%; overflow-x:auto}
svg.grafico{display:block; width:100%; height:auto; min-width:520px}

.lanc{display:grid; gap:9px; grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.lanc__item{display:flex; align-items:center; gap:11px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius-p); padding:10px 12px;
  transition:border-color .15s ease}
.lanc__item:hover{border-color:var(--line-strong)}
.lanc__item.preenchido{border-color:var(--pos); box-shadow:inset 3px 0 0 var(--pos)}
/* estados de gravação: o valor vai para o banco ao sair do campo */
.lanc__item.salvando{opacity:.65}
.lanc__item.salvo{border-color:var(--pos); box-shadow:inset 3px 0 0 var(--pos), 0 0 0 2px color-mix(in srgb, var(--pos) 28%, transparent)}
.lanc__item.erro{border-color:var(--neg); box-shadow:inset 3px 0 0 var(--neg)}
.lanc__item.erro .lanc__recado{color:var(--neg); font-weight:600}
.lanc__item.salvo .lanc__recado{color:var(--pos); font-weight:600}
.lanc__item.fechada{opacity:.7; border-style:dashed}
.lanc__item.fechada .lanc__recado{color:var(--warn); font-weight:600; text-transform:uppercase; letter-spacing:.6px}
.lanc__fechou{flex:none; width:32px; height:32px; border-radius:var(--radius-p); cursor:pointer;
  background:none; border:1px solid var(--line); color:var(--text-faint); font-size:13px;
  transition:border-color .15s ease, color .15s ease}
.lanc__fechou:hover{border-color:var(--warn); color:var(--warn)}
.lanc__item.fechada .lanc__fechou{border-color:var(--warn); color:var(--warn)}
.lanc__nome{flex:1; min-width:0}
.lanc__nome b{display:block; font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lanc__nome small{color:var(--text-faint); font-size:11px}
/* O "R$" fica fora do campo, para o que a pessoa digita ser só o número.
   A borda é desenhada no conjunto, então os dois parecem um campo só. */
.lanc__moeda{display:flex; align-items:center; gap:6px; flex:none;
  background:var(--surface); border:1px solid var(--line-strong);
  border-radius:var(--radius-p); padding:0 10px; transition:border-color .15s ease}
.lanc__moeda:focus-within{border-color:var(--brand-blue-2);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--brand-blue-2) 25%, transparent)}
.lanc__moeda>span{font-size:12px; font-weight:600; color:var(--text-faint); user-select:none}
/* vale para o campo do lançamento e para o da meta, que usam a mesma casca */
.lanc__moeda input{width:104px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums;
  border:0; background:none; padding:9px 0; min-height:0; border-radius:0}
.lanc__moeda input:hover{border:0}
.lanc__moeda input:focus-visible{outline:none}
.rodape-fixo{position:sticky; bottom:0; z-index:20; margin-top:16px; background:var(--surface);
  border:1px solid var(--line-strong); border-radius:var(--radius); box-shadow:var(--shadow-alta);
  padding:14px 18px; display:flex; flex-wrap:wrap; gap:20px; align-items:center}
.rodape-fixo .item{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.9px; font-weight:600}
.rodape-fixo .item b{display:block; margin-top:2px; font-family:var(--fonte-titulo); font-optical-sizing:auto;
  font-size:19px; font-weight:600; letter-spacing:-.3px; color:var(--text);
  text-transform:none; letter-spacing:-.3px; font-variant-numeric:tabular-nums}
.rodape-fixo .item.grande b{font-size:25px; color:var(--brand-red)}

.grade-2{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.lista-limpa{list-style:none; margin:0; padding:0}
.lista-limpa li{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.lista-limpa li:last-child{border-bottom:0}
.lista-limpa .num{font-variant-numeric:tabular-nums; margin-left:auto; font-weight:600}
.nota{font-size:12px; color:var(--text-dim); margin-top:11px; line-height:1.55; max-width:80ch}
code{background:var(--surface-2); padding:1.5px 6px; border-radius:5px; font-size:12px;
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ============================================================ LOGIN
   Cobre a página inteira até a sessão existir. O app só é baixado
   depois — antes disso não há um número sequer no navegador.          */
.login{position:fixed; inset:0; z-index:100; display:grid; place-items:center;
  background:var(--bg); padding:24px}
.login[hidden]{display:none}
.login__caixa{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow-alta); padding:30px 28px 26px}
.login__marca{display:flex; align-items:center; gap:11px; margin-bottom:22px}
.login__marca b{font-family:var(--fonte-titulo); font-optical-sizing:auto; font-weight:600;
  font-size:19px; letter-spacing:-.2px}
.login__marca span{display:block; font-size:11.5px; color:var(--text-dim); font-weight:400}
.login__campo{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.login__campo label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint)}
.login__campo input{background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius-p);
  padding:11px 13px; font-size:15px; width:100%}
.login__campo input:hover{border-color:var(--brand-blue-2)}
.login__botao{width:100%; margin-top:6px; display:flex; align-items:center; justify-content:center}
.login__erro{margin-top:14px; font-size:13px; line-height:1.5; padding:11px 13px; border-radius:var(--radius-p);
  background:color-mix(in srgb, var(--neg) 12%, transparent); color:var(--neg)}
.login__erro[hidden]{display:none}
.login__nota{margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
  font-size:12px; color:var(--text-dim); line-height:1.55}
.carregando{display:grid; place-items:center; gap:14px; min-height:50vh; color:var(--text-dim); font-size:13.5px}
.carregando__giro{width:26px; height:26px; border:2.5px solid var(--line-strong);
  border-top-color:var(--brand-red); border-radius:50%; animation:girar .7s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

@media (max-width:640px){
  .topo__linha{padding:10px 14px}
  .marca__sub,.hoje{display:none}
  .pagina{padding:18px 14px 56px}
  h2.titulo{font-size:23px}
  .kpi__val{font-size:26px}
  .abas{top:57px}
  .rodape-fixo{gap:14px; padding:12px 15px}
  .rodape-fixo .item b{font-size:17px}
  .rodape-fixo .item.grande b{font-size:21px}
  /* alvos de toque maiores no celular */
  .chip{padding:11px 16px}
  .btn--pequeno{min-height:38px; padding:8px 14px}
}
</style>
</head>
<body>

<header class="topo">
  <div class="topo__linha">
    <div class="marca">
      <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M8 6h32a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H22l-10 8v-8H8a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"
              fill="#c2211f" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="marca__nome">Dashboard Cameron</div>
        <div class="marca__sub">Fechamento diário da rede</div>
      </div>

</main>

<div class="pagina" id="carregando" hidden>
  <div class="carregando"><div class="carregando__giro"></div><span>Carregando os lançamentos…</span></div>
</div>

<div class="login" id="login" hidden>
  <form class="login__caixa" id="formLogin" autocomplete="on">
    <div class="login__marca">
      <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M8 6h32a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H22l-10 8v-8H8a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"
              fill="#c2211f" stroke="var(--surface)" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <div><b>Dashboard Cameron</b><span>Fechamento diário da rede</span></div>
    </div>

    <div class="login__campo">
      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" name="email" autocomplete="username" required>
    </div>
    <div class="login__campo">
      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" name="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn btn--primario login__botao" id="btnEntrar">Entrar</button>
    <p class="login__erro" id="loginErro" role="alert" hidden></p>

    <p class="login__nota" id="loginNota">Acesso restrito à diretoria da Livraria Cameron e a quem
      faz o lançamento. Não existe cadastro aberto: o acesso é liberado de dentro.</p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ================================================================
   ENTRADA DO APP

   Nada de faturamento vem junto com a página. O navegador só recebe
   número depois de a pessoa entrar, e mesmo assim é o banco que decide
   o que ela pode ver — as políticas de acesso do Postgres. A chave que
   aparece no config.js é a chave pública ("anon"): ela sozinha não abre
   nada, porque toda tabela está com Row Level Security ligado.
   ================================================================ */
const CFG = window.CAMERON_CONFIG || {};
const elLogin = document.getElementById('login');
const elApp = document.getElementById('app');
const elCarregando = document.getElementById('carregando');
const elErro = document.getElementById('loginErro');
const elNota = document.getElementById('loginNota');
const btnEntrar = document.getElementById('btnEntrar');
const btnSair = document.getElementById('btnSair');

let sb = null;
if (CFG.url && CFG.anonKey && window.supabase) {
  sb = window.supabase.createClient(CFG.url, CFG.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true },
  });
}
window.sbCliente = sb;   // o app usa para a tela de acessos

function mostrarErro(msg){ elErro.textContent = msg; elErro.hidden = false; }
function limparErro(){ elErro.hidden = true; }
function tela(qual){
  elLogin.hidden = qual !== 'login';
  elCarregando.hidden = qual !== 'carregando';
  elApp.hidden = qual !== 'app';
  document.querySelector('.abas').hidden = qual !== 'app';
}

/* ---------- leitura paginada ----------
   O Supabase devolve no máximo 1.000 linhas por chamada e a rede tem
   quase 12 mil lançamentos, então é preciso buscar em blocos.        */
async function lerTudo(tabela, colunas, ordem){
  const passo = 1000;
  let de = 0, acumulado = [];
  for (;;){
    const { data, error } = await sb.from(tabela).select(colunas).order(ordem).range(de, de + passo - 1);
    if (error) throw error;
    acumulado = acumulado.concat(data);
    if (data.length < passo) return acumulado;
    de += passo;
  }
}

/* ---------- monta o formato que o app espera ---------- */
async function carregarDados(){
  const [unidades, lancRaw, metasRaw, especiais] = await Promise.all([
    lerTudo('unidades', 'id,nome,curto,tipo,bloco,grupo,ativa', 'ordem'),
    lerTudo('v_lancamentos', 'unidade_id,data,valor,nao_abriu', 'data'),
    lerTudo('metas', 'unidade_id,ano,mes,valor_centavos', 'ano'),
    lerTudo('datas_especiais', 'data,nome,curto,tipo', 'data'),
  ]);

  // sem perfil liberado, as políticas devolvem vazio — não é erro de rede
  if (!unidades.length) {
    const erro = new Error('sem-perfil');
    erro.semPerfil = true;
    throw erro;
  }

  // "não abriu" fica separado: é dia registrado, mas não é venda zero —
  // se entrasse como 0 puxaria a média da loja para baixo.
  const lancamentos = {};
  const naoAbriu = {};
  for (const l of lancRaw){
    if (l.nao_abriu) { (naoAbriu[l.data] ||= {})[l.unidade_id] = true; continue; }
    (lancamentos[l.data] ||= {})[l.unidade_id] = Number(l.valor);
  }

  const anos = [...new Set(Object.keys(lancamentos).map(d => +d.slice(0,4)))].sort();
  const anoAtual = anos.length ? anos[anos.length-1] : new Date().getFullYear();

  // metas de todos os anos: ano -> mês -> unidade -> { valor, referência, percentual }
  const metas = {};
  for (const m of metasRaw){
    ((metas[m.ano] ||= {})[m.mes] ||= {})[m.unidade_id] = {
      valor: m.valor_centavos / 100,
      referencia: m.referencia_centavos == null ? null : m.referencia_centavos / 100,
      percentual: m.percentual == null ? null : Number(m.percentual),
    };
  }

  // período de atividade de cada unidade, calculado do próprio movimento
  for (const u of unidades){
    let ini = null, fim = null, n = 0;
    const anosU = new Set();
    for (const [data, dia] of Object.entries(lancamentos)){
      if (!(u.id in dia)) continue;
      n++; anosU.add(+data.slice(0,4));
      if (!ini || data < ini) ini = data;
      if (!fim || data > fim) fim = data;
    }
    u.primeiro = ini; u.ultimo = fim; u.diasComVenda = n;
    u.anos = [...anosU].sort();
    u.ativa = anosU.has(anoAtual);
  }

  const hoje = new Date();
  const hojeIso = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;

  // quem entrou e com que papel — define o que a tela de acessos deixa fazer
  let eu = { papel: 'lancamento', nome: '', email: '', id: null };
  try {
    const { data: u } = await sb.auth.getUser();
    const uid = u && u.user ? u.user.id : null;
    if (uid){
      const { data: p } = await sb.from('perfis').select('id,nome,papel').eq('id', uid).maybeSingle();
      if (p) eu = { ...p, email: u.user.email };
    }
  } catch(e){ /* segue com o papel mais restrito */ }

  let relatorio = {};
  try {
    const { data } = await sb.from('relatorio_importacao').select('conteudo').maybeSingle();
    if (data && data.conteudo) relatorio = data.conteudo;
  } catch(e){ /* o relatório é acessório: sem ele o app abre igual */ }

  return {
    origem: 'Banco de dados (Supabase)',
    hoje: hojeIso,
    eu,
    anos,
    unidades,
    metas,
    lancamentos,
    naoAbriu,
    datasEspeciais: especiais,
    dePara: relatorio.dePara || [],
    conferencia: relatorio.conferencia || [],
    avisosImportacao: relatorio.avisosImportacao || [],
  };
}

/* ---------- o app só é baixado depois de entrar ---------- */
let appCarregado = false;
function iniciarApp(dados){
  window.DADOS_CAMERON = dados;
  tela('app');
  if (appCarregado) { location.reload(); return; }
  appCarregado = true;
  const s = document.createElement('script');
  s.src = 'app.js';
  s.onerror = () => mostrarErro('Não consegui carregar o app (app.js).');
  document.body.appendChild(s);
}

async function entrarNoApp(){
  tela('carregando');
  try {
    const dados = await carregarDados();
    const { data: sessao } = await sb.auth.getUser();
    const email = sessao && sessao.user ? sessao.user.email : '';
    document.getElementById('topoQuem').textContent = email;
    btnSair.hidden = false;
    iniciarApp(dados);
  } catch (e){
    tela('login');
    if (e && e.semPerfil){
      mostrarErro('Você entrou, mas este e-mail ainda não tem acesso liberado. '
        + 'Peça para a diretoria liberar e tente de novo.');
    } else {
      mostrarErro('Não consegui carregar os dados: ' + (e && e.message ? e.message : e));
    }
  }
}

document.getElementById('formLogin').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  limparErro();
  if (!sb){
    mostrarErro('O app ainda não está ligado ao banco. Falta preencher o config.js.');
    return;
  }
  btnEntrar.disabled = true;
  btnEntrar.textContent = 'Entrando…';
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  btnEntrar.disabled = false;
  btnEntrar.textContent = 'Entrar';
  if (error){
    mostrarErro(/invalid/i.test(error.message)
      ? 'E-mail ou senha não conferem.'
      : 'Não consegui entrar: ' + error.message);
    return;
  }
  document.getElementById('loginSenha').value = '';
  entrarNoApp();
});

btnSair.addEventListener('click', async () => {
  if (sb) await sb.auth.signOut();
  location.reload();
});

/* ---------- tema: vale antes mesmo de entrar ---------- */
(function tema(){
  const btn = document.getElementById('btnTema');
  const escuro = window.matchMedia('(prefers-color-scheme: dark)');
  const atual = () => document.documentElement.dataset.theme || (escuro.matches ? 'dark' : 'light');
  const marcar = () => { btn.textContent = atual() === 'dark' ? '☀️' : '🌙'; };
  window.aplicarTema = (t) => {
    document.documentElement.dataset.theme = t;
    marcar();
    try { localStorage.setItem('cameron-tema', t); } catch(e){}
  };
  btn.addEventListener('click', () => window.aplicarTema(atual() === 'dark' ? 'light' : 'dark'));
  escuro.addEventListener('change', marcar);
  new MutationObserver(marcar).observe(document.documentElement, { attributeFilter: ['data-theme'] });
  let salvo = null;
  try { salvo = localStorage.getItem('cameron-tema'); } catch(e){}
  if (salvo === 'dark' || salvo === 'light') window.aplicarTema(salvo); else marcar();
})();

/* ---------- abertura ---------- */
(async function abertura(){
  document.querySelector('.abas').hidden = true;
  if (!sb){
    tela('login');
    elNota.innerHTML = '<b>Falta ligar ao banco.</b> Preencha o <code>config.js</code> com a URL '
      + 'e a chave anon do projeto no Supabase. Enquanto isso, a tela de entrada aparece mas não valida ninguém.';
    return;
  }
  const { data } = await sb.auth.getSession();
  if (data && data.session) entrarNoApp();
  else tela('login');
})();
</script>
</body>
